<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tuner – Menüleisten-Fenster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3A5A44}a:hover{color:#26402F}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid {{t.border}}">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px; background: {{t.surface}}; border-bottom: 1px solid {{t.border}}">
    <div style="width: 48px; height: 48px; border-radius: 10px; background: {{p.fill}}; color: #1D1D1F; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">r1</div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <div style="font-weight: 600; font-size: 14px">radioeins</div>
      <div style="color: {{t.text2}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nils Frahm – Says</div>
    </div>
    <button aria-label="Pause" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: {{p.fill}}; color: #1D1D1F; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"></rect></svg>
    </button>
    <button aria-label="Einstellungen" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin: 12px 12px 0; padding: 10px 12px; border-radius: 10px; background: {{t.surface}}; border: 1px solid {{t.border}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h13v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M17 9h3v9a2 2 0 0 1-2 2"></path><path d="M7 10h7M7 14h7"></path></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-weight: 600">Nachrichten-Umschaltung</div>
      <div style="color: {{t.text2}}; font-size: 12px">Deutschlandfunk · nächste um 12:00</div>
    </div>
    <button role="switch" aria-checked="true" aria-label="Nachrichten-Umschaltung" style="width: 38px; height: 22px; border-radius: 11px; border: none; padding: 2px; background: {{p.switchOn}}; display: flex; justify-content: flex-end; cursor: pointer">
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span>
    </button>
  </div>
  <div style="padding: 12px 12px 6px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: {{t.segBg}}; border-radius: 8px; padding: 2px">
      <button aria-pressed="true" style="height: 26px; border: none; border-radius: 6px; background: {{t.segOn}}; font: inherit; font-weight: 600; color: {{t.text}}; box-shadow: 0 1px 2px rgba(0,0,0,0.12)">Favoriten</button>
      <button aria-pressed="false" style="height: 26px; border: none; border-radius: 6px; background: transparent; font: inherit; color: {{t.text}}">Alle Sender</button>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 6px; overflow: hidden">
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: {{p.soft}}; font: inherit; color: {{t.text}}; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{p.fill}}; color: #1D1D1F; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">r1</span>
      <span style="flex-grow: 1; font-weight: 600">radioeins</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="läuft"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font: inherit; color: {{t.text}}; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{t.logo}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px">DLF</span>
      <span style="flex-grow: 1">Deutschlandfunk</span>
      <span style="font-size: 11px; color: {{t.text2}}">Nachrichtensender</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font: inherit; color: {{t.text}}; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{t.logo}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">FX</span>
      <span style="flex-grow: 1">FluxFM</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font: inherit; color: {{t.text}}; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{t.logo}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">BY</span>
      <span style="flex-grow: 1">ByteFM</span>
    </button>
    <div style="padding: 12px 8px 4px; font-size: 11px; font-weight: 600; color: {{t.text2}}">Zuletzt gehört</div>
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{t.logo}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">1L</span>
      <span style="flex-grow: 1">1LIVE</span>
      <span style="font-size: 11px; color: {{t.text2}}">gestern</span>
      <button aria-label="1LIVE zu Favoriten" style="width: 24px; height: 24px; border: none; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4l-5.6 2.9 1.1-6.2L3 9.7l6.2-.9z"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{t.logo}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">B3</span>
      <span style="flex-grow: 1">Bayern 3</span>
      <span style="font-size: 11px; color: {{t.text2}}">Mo.</span>
      <button aria-label="Bayern 3 zu Favoriten" style="width: 24px; height: 24px; border: none; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4l-5.6 2.9 1.1-6.2L3 9.7l6.2-.9z"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: {{t.logo}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">NB</span>
      <span style="flex-grow: 1">NDR Blue</span>
      <span style="font-size: 11px; color: {{t.text2}}">Sa.</span>
      <button aria-label="NDR Blue zu Favoriten" style="width: 24px; height: 24px; border: none; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4l-5.6 2.9 1.1-6.2L3 9.7l6.2-.9z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pastel":{"editor":"enum","options":["salbei","aquasalbei","pistazie","pfirsich","lavendel","vanille","rose"],"default":"aquasalbei"},"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const pal = {
  salbei:   ['#B9DCC4', '#E4F2E8', '#6FAE84'],
  pistazie: ['#C8E0A0', '#EDF5DF', '#93BC63'],
  aquasalbei: ['#BAD8D1', '#E2EEEB', '#6DB6A5'],
  pfirsich: ['#FFCFB3', '#FFEDE3', '#E8956A'],
  lavendel: ['#D5CBF2', '#EEEAFB', '#9C88DC'],
  vanille:  ['#F7E3A1', '#FBF3D6', '#D6B44A'],
  rose:     ['#F4C6D3', '#FBE7ED', '#D98AA2']
}[this.props.pastel ?? 'aquasalbei'] || ['#BAD8D1', '#E2EEEB', '#6DB6A5'];
const dark = this.props.dark ?? false;
const hex = pal[0], r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
const t = dark
  ? { bg: '#1E1E21', surface: '#2A2A2E', text: '#F2F2F3', text2: '#A1A1A8', border: '#3A3A3F', segBg: '#3A3A3F', segOn: '#5A5A60', logo: '#3A3A3F' }
  : { bg: '#F5F5F7', surface: '#FFFFFF', text: '#1D1D1F', text2: '#5F5F66', border: '#E0E0E5', segBg: '#E3E3E8', segOn: '#FFFFFF', logo: '#E3E3E8' };
return { t, p: { fill: pal[0], soft: dark ? `rgba(${r},${g},${b},0.22)` : pal[1], switchOn: pal[2] } };
}
}
</script>
</body>
</html>

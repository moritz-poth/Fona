<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tuner – Nachrichten laufen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid #E0E0E5">
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #E2EEEB; border-bottom: 1px solid #C9DDD8">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 10px; background: #BAD8D1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">DLF</div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <div style="display: flex; align-items: center; gap: 6px">
          <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.4px; background: #1D1D1F; color: #FFFFFF; border-radius: 4px; padding: 2px 6px">NACHRICHTEN</span>
          <span style="font-size: 12px; color: #3E4A47">seit 12:00</span>
        </div>
        <div style="font-weight: 600; font-size: 14px">Deutschlandfunk</div>
      </div>
      <button aria-label="Pause" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #BAD8D1; color: #1D1D1F; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"></rect></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3E4A47" stroke-width="2" aria-hidden="true"><path d="M9 14l-5-5 5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-2"></path></svg>
      <span style="flex-grow: 1; color: #3E4A47">Danach zurück zu radioeins</span>
      <button style="height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid #9FC2BA; background: #FFFFFF; font: inherit; color: #1D1D1F">Jetzt zurück</button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; margin: 12px 12px 0; padding: 10px 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E0E0E5">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h13v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M17 9h3v9a2 2 0 0 1-2 2"></path><path d="M7 10h7M7 14h7"></path></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-weight: 600">Nachrichten-Umschaltung</div>
      <div style="color: #5F5F66; font-size: 12px">Läuft gerade · erkannt am Sendungstitel</div>
    </div>
    <button role="switch" aria-checked="true" aria-label="Nachrichten-Umschaltung" style="width: 38px; height: 22px; border-radius: 11px; border: none; padding: 2px; background: #6DB6A5; display: flex; justify-content: flex-end">
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.25)"></span>
    </button>
  </div>
  <div style="padding: 12px 12px 6px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E3E3E8; border-radius: 8px; padding: 2px">
      <button aria-pressed="true" style="height: 26px; border: none; border-radius: 6px; background: #FFFFFF; font: inherit; font-weight: 600; color: #1D1D1F; box-shadow: 0 1px 2px rgba(0,0,0,0.12)">Favoriten</button>
      <button aria-pressed="false" style="height: 26px; border: none; border-radius: 6px; background: transparent; font: inherit; color: #1D1D1F">Alle Sender</button>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 6px; overflow: hidden">
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font: inherit; color: #1D1D1F; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: #E3E3E8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">r1</span>
      <span style="flex-grow: 1">radioeins</span>
      <span style="font-size: 11px; color: #5F5F66">unterbrochen</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: #E2EEEB; font: inherit; color: #1D1D1F; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: #BAD8D1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px">DLF</span>
      <span style="flex-grow: 1; font-weight: 600">Deutschlandfunk</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="läuft"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font: inherit; color: #1D1D1F; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: #E3E3E8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">FX</span>
      <span style="flex-grow: 1">FluxFM</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: none; border-radius: 7px; background: transparent; font: inherit; color: #1D1D1F; text-align: left">
      <span style="width: 28px; height: 28px; border-radius: 6px; background: #E3E3E8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px">BY</span>
      <span style="flex-grow: 1">ByteFM</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
